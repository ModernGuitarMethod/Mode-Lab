<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta http-equiv="Permissions-Policy" content="microphone=*"/>
<title>Mode Lab</title>
<meta name="application-name" content="ModeLab"/>
<meta name="apple-mobile-web-app-title" content="ModeLab"/>
<link rel="manifest" href="manifest.webmanifest"/><link rel="apple-touch-icon" href="apple-touch-icon.png"/>
</head>
<body>
<script>
const p = new URLSearchParams(location.search);
const lab = (p.get("lab")||"").toLowerCase();
p.delete("lab");
/* Landing = Mode. Pill order: Study · Mode · Fret · Jam · Chord · Tab · Song */
const file = lab==="jam" ? "Jam-Lab-v1.89.html"
  : lab==="fret" ? "Fret-Lab-v1.89.html"
  : lab==="chord" ? "Chord-Lab-v1.89.html"
  : lab==="tab" || lab==="player" ? "Tab-Lab-v1.89.html"
  : lab==="song" || lab==="songwriter" ? "Songwriter-Lab-v1.89.html"
  : lab==="study" || lab==="know" ? "Study-Lab-v1.89.html"
  : "Mode-Lab-v1.89.html";
const q = p.toString();
location.replace(q ? file+"?"+q : file);
</script>
</body>
</html>
